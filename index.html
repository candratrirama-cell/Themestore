<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ThemeX - Premium Themes Store</title>
    <link rel="icon" href="https://i.ibb.co/nhzx0CS/20260105-114157.png" type="image/png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --card: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --text: #ffffff;
            --text-dim: #a1a1a6;
            --sponsor-bg: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,165,0,0.05));
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); transition: background 0.5s; min-height: 100vh; }
        .view { display: none; padding-bottom: 120px; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 16px; }
        header { padding: 15px 0 10px; }
        .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-row h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .brand-row h1 span { background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .search-bar { background: var(--card); border-radius: 18px; display: flex; align-items: center; padding: 0 14px; backdrop-filter: blur(30px); }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 14px 10px; color: var(--text); font-size: 16px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 15px; }
        .card { cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.97); }
        .card-img { width: 100%; aspect-ratio: 0.68; border-radius: 20px; overflow: hidden; background: #111; margin-bottom: 8px; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        
        /* SPONSOR BANNER - DIPERJELAS */
        .sponsor-banner-section {
            margin: 20px 0 10px;
            background: var(--sponsor-bg);
            border-radius: 24px;
            padding: 16px;
            border: 2px solid rgba(255,215,0,0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .sponsor-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-weight: 800;
            font-size: 14px;
            color: #ffd700;
        }
        .sponsor-banner-img {
            width: 100%;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .sponsor-banner-img:hover { transform: scale(1.01); }
        .sponsor-banner-img:active { transform: scale(0.98); }
        .countdown-tag {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
            display: inline-block;
            color: #ffd700;
        }
        
        .dock-wrap { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 8000; pointer-events: none; }
        .dock { background: rgba(20,20,20,0.7); backdrop-filter: blur(30px); padding: 6px; border-radius: 32px; display: flex; gap: 8px; pointer-events: auto; }
        .dock-item { width: 50px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: 0.3s; cursor: pointer; }
        .dock-item.active { background: var(--accent); color: var(--bg); width: 120px; }
        .dock-item span { font-size: 14px; font-weight: 700; margin-left: 8px; display: none; }
        .dock-item.active span { display: block; }
        
        .panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9000; transform: translateY(100%); transition: 0.4s; overflow-y: auto; }
        .panel.active { transform: translateY(0); }
        .panel-nav { position: sticky; top: 0; padding: 12px 16px; display: flex; justify-content: space-between; background: linear-gradient(to bottom, var(--bg) 80%, transparent); }
        .gallery { display: flex; gap: 10px; overflow-x: auto; padding: 10px 20px; }
        .gallery-item { min-width: 85%; height: 420px; display: flex; justify-content: center; align-items: center; }
        .gallery-item img { height: 100%; width: auto; object-fit: contain; border-radius: 12px; }
        
        .comments-section { margin-top: 25px; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .comment-input-area { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .comment-input-area input { flex: 1; background: var(--card); border: none; padding: 12px 16px; border-radius: 30px; color: var(--text); outline: none; }
        .comment-input-area button { background: var(--accent); color: var(--bg); border: none; padding: 0 20px; border-radius: 30px; font-weight: 700; cursor: pointer; }
        .comment-item { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
        
        .btn-round { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: var(--text); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .apply-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px; background: rgba(10,10,10,0.9); backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 8px; z-index: 10000; transform: translateY(100%); transition: 0.4s; }
        .panel.active ~ .apply-bar { transform: translateY(0); }
        .btn-apply { width: 100%; height: 50px; border-radius: 25px; background: var(--accent); color: var(--bg); border: none; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
        .stat-pill { background: var(--card); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
        #toast { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--bg); padding: 10px 20px; border-radius: 30px; z-index: 21000; opacity: 0; transition: 0.3s; }
        #toast.active { opacity: 1; top: 60px; }
        
        .interstitial-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(15px); }
        .interstitial-box { background: var(--bg); border-radius: 48px; max-width: 340px; width: 85%; padding: 24px; text-align: center; border: 3px solid #FFD700; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .interstitial-countdown { font-size: 48px; font-weight: 800; color: #FFD700; margin: 15px 0; }
        .interstitial-btn { background: #FFD700; border: none; padding: 14px 28px; border-radius: 40px; font-weight: bold; cursor: pointer; opacity: 0.5; }
        .interstitial-btn.active { opacity: 1; }
    </style>
</head>
<body data-theme="dark">
    <div id="toast">Notifikasi</div>
    <div id="view-home" class="view active">
        <div class="container">
            <header>
                <div class="brand-row">
                    <h1>theme<span>X</span></h1>
                    <button class="btn-round" onclick="toggleTheme()"><i data-lucide="moon"></i></button>
                </div>
                <div class="search-bar">
                    <i data-lucide="search"></i>
                    <input type="text" id="searchInput" placeholder="Cari tema..." oninput="doSearch()">
                </div>
            </header>
            <div id="bannerSponsorContainer"></div>
            <div class="grid" id="mainGrid"></div>
        </div>
    </div>
    <div id="view-browse" class="view">
        <div class="container">
            <header><h1>Jelajahi</h1></header>
            <div id="bannerSponsorBrowse"></div>
            <div class="grid" id="browseGrid"></div>
        </div>
    </div>
    <div id="view-fav" class="view">
        <div class="container"><header><h1>Favorit</h1></header><div class="grid" id="favGrid"></div></div>
    </div>
    <div id="view-settings" class="view">
        <div class="container"><header><h1>Menu</h1></header>
            <div class="stat-pill" style="justify-content:space-between;padding:22px;margin-bottom:12px;cursor:pointer" onclick="window.open('https://whatsapp.com/channel/0029VbB8MZt8V0ttSDmHn22j','_blank')"><div><i data-lucide="message-circle"></i> Saluran WhatsApp</div><i data-lucide="chevron-right"></i></div>
            <div class="stat-pill" style="justify-content:space-between;padding:22px;cursor:pointer" onclick="window.open('https://saweria.co/ramateam','_blank')"><div><i data-lucide="heart"></i> Donasi Developer</div><i data-lucide="external-link"></i></div>
        </div>
    </div>
    
    <div class="dock-wrap" id="mainDock">
        <div class="dock">
            <div class="dock-item active" onclick="switchView('home',this)"><i data-lucide="home"></i><span>Beranda</span></div>
            <div class="dock-item" onclick="switchView('browse',this)"><i data-lucide="compass"></i><span>Jelajah</span></div>
            <div class="dock-item" onclick="switchView('fav',this)"><i data-lucide="heart"></i><span>Favorit</span></div>
            <div class="dock-item" onclick="switchView('settings',this)"><i data-lucide="menu"></i><span>Menu</span></div>
        </div>
    </div>
    
    <div id="detailPanel" class="panel"><div class="panel-nav"><button class="btn-round" onclick="closeDetail()"><i data-lucide="chevron-down"></i></button><button class="btn-round" onclick="copyShareLink()"><i data-lucide="share-2"></i></button></div><div class="gallery" id="detGallery"></div><div class="container"><div style="display:flex;justify-content:space-between;margin-bottom:15px"><div><h2 id="detTitle">Nama Tema</h2><p id="detAuthor" style="color:var(--text-dim)"><i data-lucide="shield-check"></i> <span>Creator</span></p></div><button id="detLikeBtn" class="btn-round"><i data-lucide="heart"></i></button></div><div style="display:flex;gap:8px;margin-bottom:20px"><div class="stat-pill"><i data-lucide="thumbs-up"></i> <span id="detLikeCount">0</span></div><div class="stat-pill"><i data-lucide="box"></i> <span id="detSize">3.5 MB</span></div></div><p id="detDesc" style="color:var(--text-dim);margin-bottom:30px"></p><div class="comments-section"><h3>💬 Komentar</h3><div class="comment-input-area"><input type="text" id="commentNameInput" placeholder="Nama"><input type="text" id="commentTextInput" placeholder="Komentar"><button onclick="postComment()">Kirim</button></div><div id="commentsList"></div></div></div></div>
    <div class="apply-bar" id="bottomApplyBar"><button class="btn-apply" id="installBtn"><i data-lucide="download-cloud"></i> UNDUH TEMA</button></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://miningtransaction-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let allData = [], favorites = JSON.parse(localStorage.getItem('themeX_favs') || '[]');
        let likedItems = JSON.parse(localStorage.getItem('themeX_liked') || '[]');
        let currentItem = null, sponsorData = null;
        let interstitialShownThisSession = false;

        onValue(ref(db, 'apps/'), (snap) => {
            const data = snap.val();
            if(data) allData = Object.keys(data).filter(k => !data[k].is_apk).map(k => ({ id: k, ...data[k], likes: data[k].likes || 0 }));
            refreshView();
        });

        onValue(ref(db, 'sponsor/'), (snap) => {
            sponsorData = snap.val();
            renderBannerSponsor();
            if(sponsorData && sponsorData.active && Date.now() < sponsorData.expiryTime && sponsorData.imageUrl) {
                if(sponsorData.adType === 'popup' && !localStorage.getItem('popupShown_'+sponsorData.updatedAt)) showPopupSponsor();
                if(sponsorData.adType === 'interstitial' && !interstitialShownThisSession && !localStorage.getItem('interstitialShown_'+sponsorData.updatedAt)) showInterstitialSponsor();
            }
        });

        function renderBannerSponsor() {
            const containers = ['bannerSponsorContainer', 'bannerSponsorBrowse'];
            const isValid = sponsorData && sponsorData.active && Date.now() < sponsorData.expiryTime && sponsorData.imageUrl && sponsorData.adType === 'banner';
            
            if(!isValid) {
                containers.forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = ''; });
                return;
            }
            
            const html = `
                <div class="sponsor-banner-section">
                    <div class="sponsor-header">
                        <i data-lucide="crown"></i> 
                        <span>✨ DISPONSORI OLEH ✨</span>
                    </div>
                    <img src="${sponsorData.imageUrl}" class="sponsor-banner-img" onclick="window.open('${sponsorData.link}','_blank')" 
                         onerror="this.src='https://placehold.co/800x200?text=Gambar+Sponsor+Tidak+Tersedia'">
                    <div class="countdown-tag" id="bannerCountdown"></div>
                </div>
            `;
            containers.forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = html; });
            lucide.createIcons();
            startCountdown(sponsorData.expiryTime);
        }

        function startCountdown(expiry) {
            const update = () => {
                const diff = expiry - Date.now();
                if(diff <= 0) return;
                const days = Math.floor(diff/86400000), hours = Math.floor((diff%86400000)/3600000), mins = Math.floor((diff%3600000)/60000);
                let text = days>0 ? `${days} hari lagi` : hours>0 ? `${hours} jam ${mins} menit` : `${mins} menit`;
                const el = document.getElementById('bannerCountdown');
                if(el) el.innerText = `🎉 Promo spesial berakhir: ${text}`;
            };
            update();
            setInterval(update, 60000);
        }

        function showPopupSponsor() {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(15px);z-index:100001;display:flex;justify-content:center;align-items:center;';
            modal.innerHTML = `<div style="background:var(--bg);border-radius:48px;max-width:320px;width:80%;padding:24px;text-align:center;border:2px solid #FFD700;animation:popIn 0.3s ease"><i data-lucide="gift" style="width:50px;height:50px;color:#FFD700"></i><h2 style="margin:12px 0">✨ Sponsor Spesial</h2><img src="${sponsorData.imageUrl}" style="width:100%;border-radius:24px;margin:12px 0" onerror="this.src='https://placehold.co/400x200?text=Gambar+Sponsor'"><button id="popupCloseBtn" style="background:#FFD700;border:none;padding:12px 24px;border-radius:40px;font-weight:bold;margin-top:8px">Lihat Promo</button><p style="margin-top:12px;font-size:12px;opacity:0.6">Klik di luar untuk tutup</p></div>`;
            document.body.appendChild(modal);
            lucide.createIcons();
            modal.querySelector('#popupCloseBtn').onclick = () => { window.open(sponsorData.link, '_blank'); modal.remove(); };
            modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
            localStorage.setItem('popupShown_'+sponsorData.updatedAt, 'true');
            setTimeout(() => modal.remove(), 15000);
        }

        function showInterstitialSponsor() {
            interstitialShownThisSession = true;
            localStorage.setItem('interstitialShown_'+sponsorData.updatedAt, 'true');
            const overlay = document.createElement('div');
            overlay.className = 'interstitial-overlay';
            let countdown = 5;
            overlay.innerHTML = `<div class="interstitial-box"><i data-lucide="alert-triangle" style="width:50px;height:50px;color:#FFD700"></i><h2 style="margin:12px 0">✨ Iklan Sponsor ✨</h2><img src="${sponsorData.imageUrl}" style="width:100%;border-radius:24px;margin:12px 0" onerror="this.src='https://placehold.co/400x200?text=Gambar+Sponsor'"><div class="interstitial-countdown" id="interstitialCountdown">5</div><button id="interstitialBtn" class="interstitial-btn" disabled>⏳ Tunggu ${countdown} detik</button></div>`;
            document.body.appendChild(overlay);
            lucide.createIcons();
            const btn = overlay.querySelector('#interstitialBtn');
            const cdSpan = overlay.querySelector('#interstitialCountdown');
            const timer = setInterval(() => {
                countdown--;
                if(cdSpan) cdSpan.innerText = countdown;
                if(btn) btn.innerText = countdown > 0 ? `⏳ Tunggu ${countdown} detik` : '✅ Buka Promo Sekarang';
                if(countdown <= 0) {
                    clearInterval(timer);
                    if(btn) {
                        btn.disabled = false;
                        btn.classList.add('active');
                        btn.innerText = '✅ Buka Promo Sekarang';
                        btn.onclick = () => { window.open(sponsorData.link, '_blank'); overlay.remove(); };
                    }
                }
            }, 1000);
            overlay.onclick = (e) => { if(e.target === overlay && countdown <= 0) overlay.remove(); };
        }

        function refreshView() {
            const active = document.querySelector('.view.active').id;
            if(active === 'view-home') renderItems(allData, 'mainGrid');
            if(active === 'view-browse') renderItems([...allData].reverse(), 'browseGrid');
            if(active === 'view-fav') renderItems(allData.filter(i => favorites.includes(i.id)), 'favGrid');
        }

        function renderItems(items, gridId) {
            const grid = document.getElementById(gridId);
            if(!grid) return;
            grid.innerHTML = items.length ? '' : '<p style="text-align:center;padding:60px;opacity:0.3">Tidak ada tema.</p>';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openDetail(item);
                div.innerHTML = `<div class="card-img"><img src="${item.images?.[0] || ''}" loading="lazy"></div><div><p style="font-weight:700">${item.name}</p><p style="font-size:11px;color:var(--text-dim)">${item.dev || 'Verified'}</p></div>`;
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        window.switchView = (viewName, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            el.classList.add('active');
            refreshView();
        };

        window.openDetail = (item) => {
            currentItem = item;
            document.getElementById('detTitle').innerText = item.name;
            document.getElementById('detAuthor').querySelector('span').innerText = item.dev || 'ThemeX';
            document.getElementById('detLikeCount').innerText = item.likes;
            document.getElementById('detSize').innerText = item.size || '3.5 MB';
            document.getElementById('detDesc').innerText = item.desc || "Tema premium eksklusif.";
            const gallery = document.getElementById('detGallery');
            gallery.innerHTML = '';
            (item.images || []).forEach(img => { gallery.innerHTML += `<div class="gallery-item"><img src="${img}"></div>`; });
            document.getElementById('detLikeBtn').style.color = likedItems.includes(item.id) ? '#ff3b30' : 'var(--text)';
            document.getElementById('detLikeBtn').onclick = () => handleLike(item.id);
            document.getElementById('installBtn').onclick = () => { showToast("Membuka link..."); setTimeout(() => window.open(item.link, '_blank'), 300); };
            loadComments(item.id);
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('mainDock').style.transform = 'translateY(150%)';
        };

        window.closeDetail = () => {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('mainDock').style.transform = 'translateY(0)';
        };

        async function handleLike(id) {
            if(likedItems.includes(id)) return;
            await runTransaction(ref(db, `apps/${id}/likes`), (c) => (c || 0) + 1);
            likedItems.push(id);
            if(!favorites.includes(id)) favorites.push(id);
            localStorage.setItem('themeX_liked', JSON.stringify(likedItems));
            localStorage.setItem('themeX_favs', JSON.stringify(favorites));
            showToast("Disukai!");
            refreshView();
        }

        function loadComments(themeId) {
            const commentsRef = ref(db, `comments/${themeId}`);
            onValue(commentsRef, (snap) => {
                const comments = snap.val();
                const container = document.getElementById('commentsList');
                if(!comments) { container.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.5">Belum ada komentar.</div>'; return; }
                const arr = Object.entries(comments).map(([id,val]) => ({ id, ...val })).sort((a,b) => b.timestamp - a.timestamp);
                container.innerHTML = arr.map(c => `<div class="comment-item"><div class="comment-name"><i data-lucide="user"></i> ${escapeHtml(c.name)} <span style="font-size:10px;opacity:0.5">${new Date(c.timestamp).toLocaleString()}</span></div><div>${escapeHtml(c.text)}</div></div>`).join('');
                lucide.createIcons();
            });
        }

        window.postComment = async () => {
            if(!currentItem) return;
            let name = document.getElementById('commentNameInput').value.trim();
            const text = document.getElementById('commentTextInput').value.trim();
            if(!name) name = "Anonim";
            if(!text) { showToast("Komentar kosong!"); return; }
            await push(ref(db, `comments/${currentItem.id}`), { name: name.slice(0,30), text: text.slice(0,200), timestamp: Date.now() });
            document.getElementById('commentTextInput').value = '';
            showToast("Komentar terkirim!");
        };

        window.copyShareLink = () => { if(currentItem) { navigator.clipboard.writeText(currentItem.link); showToast("Link disalin!"); } };
        window.toggleTheme = () => { const isDark = document.body.getAttribute('data-theme') === 'dark'; document.body.setAttribute('data-theme', isDark ? 'light' : 'dark'); lucide.createIcons(); };
        window.showToast = (msg) => { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('active'); setTimeout(() => t.classList.remove('active'), 2000); };
        window.doSearch = () => { renderItems(allData.filter(i => i.name.toLowerCase().includes(document.getElementById('searchInput').value.toLowerCase())), 'mainGrid'); };
        function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '&gt;' }[m])) || ''; }
        lucide.createIcons();
    </script>
</body>
</html>
