<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ThemeX Store - Premium Themes</title>
    <link rel="icon" href="https://i.ibb.co/nhzx0CS/20260105-114157.png" type="image/png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --card: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --text: #ffffff;
            --text-dim: #a1a1a6;
            --glass-border: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.2) 100%);
            --ios-blur: blur(30px) saturate(210%);
            --ios-bezier: cubic-bezier(0.25, 1, 0.5, 1);
            --heart: #ff3b30;
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --card: rgba(0, 0, 0, 0.05);
            --accent: #000000;
            --text: #000000;
            --text-dim: #636366;
            --glass-border: linear-gradient(135deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.1) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); transition: background 0.5s var(--ios-bezier); min-height: 100vh; overflow-x: hidden; }
        .view { display: none; padding-bottom: 120px; }
        .view.active { display: block; animation: viewEnter 0.5s var(--ios-bezier); }
        @keyframes viewEnter { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 16px; }
        header { padding: 15px 0 10px; }
        .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-row h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .search-bar { background: var(--card); border-radius: 18px; display: flex; align-items: center; padding: 0 14px; backdrop-filter: var(--ios-blur); position: relative; }
        .search-bar::before { content: ""; position: absolute; inset: 0; padding: 1px; background: var(--glass-border); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; border-radius: 18px; pointer-events: none; }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 14px 10px; color: var(--text); font-size: 16px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 15px; }
        .card { cursor: pointer; transition: 0.3s var(--ios-bezier); }
        .card-img { width: 100%; aspect-ratio: 0.68; border-radius: 20px; overflow: hidden; background: #111; margin-bottom: 8px; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .dock-wrap { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 8000; pointer-events: none; transition: transform 0.4s var(--ios-bezier); }
        .dock { background: rgba(20, 20, 20, 0.7); backdrop-filter: var(--ios-blur); padding: 6px; border-radius: 32px; display: flex; gap: 8px; pointer-events: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .dock-item { width: 50px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: 0.4s var(--ios-bezier); cursor: pointer; }
        .dock-item.active { background: var(--accent); color: var(--bg); width: 120px; }
        .dock-item span { font-size: 14px; font-weight: 700; margin-left: 8px; display: none; }
        .dock-item.active span { display: block; }
        .panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9000; transform: translateY(100%); transition: 0.5s var(--ios-bezier); overflow-y: auto; padding-bottom: 180px; }
        .panel.active { transform: translateY(0); }
        .panel-nav { position: sticky; top: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, var(--bg) 80%, transparent); z-index: 9999; }
        .gallery { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 10px 20px; margin-bottom: 10px; scroll-snap-type: x mandatory; }
        .gallery-item { min-width: 85%; height: 420px; display: flex; justify-content: center; align-items: center; scroll-snap-align: center; border-radius: 24px; overflow: hidden; }
        .gallery-item img { height: 100%; width: auto; max-width: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-round { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: var(--text); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .apply-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 10px)); background: rgba(10, 10, 10, 0.9); backdrop-filter: var(--ios-blur); display: flex; flex-direction: column; gap: 8px; z-index: 10000; transform: translateY(100%); transition: 0.5s var(--ios-bezier); border-top: 1px solid rgba(255,255,255,0.1); }
        .panel.active ~ .apply-bar { transform: translateY(0); }
        .btn-apply { width: 100%; height: 50px; border-radius: 25px; background: var(--accent); color: var(--bg); border: none; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
        .stat-pill { background: var(--card); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; position: relative; }
        .comment-section { margin-top: 20px; padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .comment-input { display: flex; gap: 10px; margin-bottom: 15px; }
        .comment-input input { flex: 1; background: var(--card); border: none; padding: 12px; border-radius: 20px; color: var(--text); outline: none; }
        .comment-item { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
        .banner-ad { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 20px; margin: 15px 0; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; position: relative; }
        .banner-ad img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
        .banner-ad-content { flex: 1; padding: 0 12px; }
        .banner-ad-title { font-weight: 800; font-size: 14px; }
        .close-ad { background: rgba(0,0,0,0.5); width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .fullscreen-ad { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: 0.3s; }
        .fullscreen-ad.active { visibility: visible; opacity: 1; }
        .fullscreen-ad img { max-width: 90%; max-height: 70%; border-radius: 20px; margin-bottom: 20px; cursor: pointer; }
        .ad-timer { background: var(--accent); color: var(--bg); padding: 10px 20px; border-radius: 30px; font-weight: 800; margin-top: 15px; cursor: pointer; }
        #toast { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--bg); padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 800; z-index: 21000; opacity: 0; transition: 0.4s; pointer-events: none; }
        #toast.active { opacity: 1; top: 60px; }
    </style>
</head>
<body data-theme="dark">
    <div id="toast">Notifikasi</div>

    <div id="fullscreenAd" class="fullscreen-ad">
        <img id="fsAdImg" src="" alt="sponsor">
        <div id="adTimerBtn" class="ad-timer">Tutup (5)</div>
    </div>

    <div id="view-home" class="view active">
        <div class="container">
            <header><div class="brand-row"><h1>theme<span>X</span></h1><button class="btn-round" onclick="toggleTheme()"><i data-lucide="moon"></i></button></div>
            <div class="search-bar"><i data-lucide="search"></i><input type="text" id="searchInput" placeholder="Cari tema premium..." oninput="doSearch()"></div></header>
            <div id="bannerAdContainer"></div>
            <div class="grid" id="mainGrid"></div>
        </div>
    </div>

    <div id="view-browse" class="view"><div class="container"><header><h1>Jelajahi</h1></header><div class="grid" id="browseGrid"></div></div></div>
    <div id="view-fav" class="view"><div class="container"><header><h1>Favorit</h1></header><div id="favGrid" class="grid"></div></div></div>
    <div id="view-settings" class="view"><div class="container"><header><h1>Menu</h1></header>
        <div class="stat-pill" style="justify-content: space-between; padding: 22px; margin-bottom: 12px; cursor:pointer; border-radius: 20px;" onclick="window.open('https://whatsapp.com/channel/0029VbB8MZt8V0ttSDmHn22j', '_blank')"><div style="display: flex; align-items: center; gap: 12px;"><i data-lucide="message-circle" style="color:#25D366"></i> Saluran WhatsApp</div><i data-lucide="chevron-right"></i></div>
        <div class="stat-pill" style="justify-content: space-between; padding: 22px; margin-bottom: 12px; cursor:pointer; border-radius: 20px;" onclick="window.open('https://saweria.co/ramateam', '_blank')"><div style="display: flex; align-items: center; gap: 12px;"><i data-lucide="heart" style="color:#ff3b30"></i> Donasi Developer</div><i data-lucide="external-link"></i></div>
    </div></div>

    <div class="dock-wrap" id="mainDock"><div class="dock"><div class="dock-item active" onclick="switchView('home', this)"><i data-lucide="home"></i><span>Beranda</span></div><div class="dock-item" onclick="switchView('browse', this)"><i data-lucide="compass"></i><span>Jelajah</span></div><div class="dock-item" onclick="switchView('fav', this)"><i data-lucide="heart"></i><span>Favorit</span></div><div class="dock-item" onclick="switchView('settings', this)"><i data-lucide="menu"></i><span>Menu</span></div></div></div>

    <div id="detailPanel" class="panel">
        <div class="panel-nav"><button class="btn-round" onclick="closeDetail()"><i data-lucide="chevron-down"></i></button><button class="btn-round" onclick="copyShareLink()"><i data-lucide="share-2"></i></button></div>
        <div class="gallery" id="detGallery"></div>
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;"><div><h2 id="detTitle" style="font-size: 24px; font-weight: 800;"></h2><p id="detAuthor" style="color: var(--text-dim); font-size: 13px;"><i data-lucide="shield-check" style="width:14px"></i> <span></span></p></div><button id="detLikeBtn" class="btn-round" style="width: 50px; height: 50px;"><i data-lucide="heart"></i></button></div>
            <div style="display: flex; gap: 8px; margin-bottom: 20px;"><div class="stat-pill"><i data-lucide="thumbs-up"></i> <span id="detLikeCount">0</span></div><div class="stat-pill"><i data-lucide="box"></i> <span id="detSize">3.5 MB</span></div></div>
            <p id="detDesc" style="line-height: 1.5; color: var(--text-dim); font-size: 14px; margin-bottom: 30px;"></p>
            <div class="comment-section"><h4 style="margin-bottom: 12px;">💬 Komentar</h4><div class="comment-input"><input type="text" id="commentName" placeholder="Nama" value="User"><input type="text" id="commentMsg" placeholder="Tulis komentar..."><button class="btn-round" onclick="postComment()" style="width: auto; padding: 0 16px;"><i data-lucide="send"></i></button></div><div id="commentsList"></div></div>
        </div>
    </div>

    <div class="apply-bar" id="bottomApplyBar"><button class="btn-apply" id="installBtn"><i data-lucide="download-cloud"></i> UNDUH TEMA</button></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, runTransaction, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://miningtransaction-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let allData = [];
        let favorites = JSON.parse(localStorage.getItem('themeX_favs') || '[]');
        let likedItems = JSON.parse(localStorage.getItem('themeX_liked') || '[]');
        let currentItem = null;
        let bannerAd = null;
        let fullscreenAd = null;

        function loadAds() {
            const adsRef = ref(db, 'ads_config');
            onValue(adsRef, (snapshot) => {
                const ads = snapshot.val();
                if(ads) {
                    bannerAd = ads.banner;
                    fullscreenAd = ads.fullscreen;
                    renderBannerAd();
                }
            });
        }

        function renderBannerAd() {
            const container = document.getElementById('bannerAdContainer');
            if(!container) return;
            if(bannerAd && bannerAd.enabled && bannerAd.image_url) {
                container.innerHTML = `<div class="banner-ad" onclick="window.open('${bannerAd.link_url}', '_blank')"><img src="${bannerAd.image_url}"><div class="banner-ad-content"><div class="banner-ad-title">${bannerAd.title || 'Sponsor'}</div><div class="banner-ad-sub">${bannerAd.subtitle || ''}</div></div><div class="close-ad" onclick="event.stopPropagation(); closeBannerAd()">✕</div></div>`;
            } else { container.innerHTML = ''; }
        }

        window.closeBannerAd = () => { document.getElementById('bannerAdContainer').innerHTML = ''; localStorage.setItem('banner_closed', Date.now()); };

        function showFullscreenAd() {
            if(!fullscreenAd || !fullscreenAd.enabled || !fullscreenAd.image_url) return;
            const lastShown = localStorage.getItem('fs_ad_shown');
            if(lastShown && (Date.now() - parseInt(lastShown)) < 3600000) return;
            
            const fsDiv = document.getElementById('fullscreenAd');
            const fsImg = document.getElementById('fsAdImg');
            fsImg.src = fullscreenAd.image_url;
            fsImg.onclick = () => { if(fullscreenAd.link_url) window.open(fullscreenAd.link_url, '_blank'); };
            fsDiv.classList.add('active');
            let count = 5;
            const timerBtn = document.getElementById('adTimerBtn');
            timerBtn.innerText = `Tutup (${count})`;
            timerBtn.style.pointerEvents = 'none';
            const interval = setInterval(() => {
                count--;
                if(count <= 0) {
                    clearInterval(interval);
                    timerBtn.innerText = 'Tutup';
                    timerBtn.style.pointerEvents = 'auto';
                    timerBtn.onclick = () => { fsDiv.classList.remove('active'); localStorage.setItem('fs_ad_shown', Date.now()); };
                } else { timerBtn.innerText = `Tutup (${count})`; }
            }, 1000);
        }

        onValue(ref(db, 'apps/'), (snapshot) => {
            const data = snapshot.val();
            if(data) { allData = Object.keys(data).filter(key => !data[key].is_apk).map(key => ({ id: key, ...data[key], likes: data[key].likes || 0 })); refreshView(); loadAds(); setTimeout(() => showFullscreenAd(), 1000); }
        });

        function refreshView() {
            const activeView = document.querySelector('.view.active').id;
            if(activeView === 'view-home') renderItems(allData, 'mainGrid');
            if(activeView === 'view-browse') renderItems([...allData].reverse(), 'browseGrid');
            if(activeView === 'view-fav') renderItems(allData.filter(i => favorites.includes(i.id)), 'favGrid');
        }

        function renderItems(items, gridId) {
            const grid = document.getElementById(gridId);
            if(!grid) return;
            grid.innerHTML = items.length ? '' : '<p style="grid-column:1/-1;text-align:center;padding:60px;opacity:0.3;">Belum ada tema.</p>';
            items.forEach(item => { const div = document.createElement('div'); div.className = 'card'; div.onclick = () => openDetail(item); div.innerHTML = `<div class="card-img"><img src="${item.images?.[0]||''}" loading="lazy"></div><div><p style="font-weight:700;font-size:14px;">${item.name}</p><p style="font-size:11px;color:var(--text-dim);">${item.dev||'Verified'}</p></div>`; grid.appendChild(div); });
            lucide.createIcons();
        }

        window.switchView = (viewName, el) => { document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.querySelectorAll('.dock-item').forEach(d=>d.classList.remove('active')); document.getElementById(`view-${viewName}`).classList.add('active'); el.classList.add('active'); refreshView(); window.scrollTo({top:0}); };

        function loadComments(itemId) { onValue(ref(db, `comments/${itemId}`), (snapshot) => { const comments = snapshot.val(); const container = document.getElementById('commentsList'); if(!container) return; if(!comments) { container.innerHTML = '<p style="color:var(--text-dim);text-align:center;">Belum ada komentar</p>'; return; } container.innerHTML = Object.entries(comments).map(([id,c])=>`<div class="comment-item"><div><strong>${escapeHtml(c.name)}</strong></div><div>${escapeHtml(c.message)}</div><div style="font-size:10px;color:var(--text-dim);margin-top:5px;">${new Date(c.timestamp).toLocaleString()}</div></div>`).reverse().join(''); lucide.createIcons(); }); }
        
        window.postComment = () => { if(!currentItem) return; const name = document.getElementById('commentName').value.trim()||"Anonim"; const msg = document.getElementById('commentMsg').value.trim(); if(!msg) return showToast("Komentar kosong"); push(ref(db, `comments/${currentItem.id}`), { name, message: msg, timestamp: Date.now() }); document.getElementById('commentMsg').value=''; showToast("Komentar terkirim"); };
        
        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;}); }

        window.openDetail = (item) => { currentItem = item; document.getElementById('detTitle').innerText = item.name; document.getElementById('detAuthor').querySelector('span').innerText = item.dev||'Creator'; document.getElementById('detLikeCount').innerText = item.likes; document.getElementById('detSize').innerText = item.size||'3.5 MB'; document.getElementById('detDesc').innerText = item.desc||"Desain premium untuk smartphone Anda."; document.getElementById('detGallery').innerHTML = (item.images||[]).map(img=>`<div class="gallery-item"><img src="${img}"></div>`).join(''); const heartIcon = document.getElementById('detLikeBtn').querySelector('i'); heartIcon.style.color = likedItems.includes(item.id) ? 'var(--heart)' : 'var(--text)'; document.getElementById('detLikeBtn').onclick = () => handleLike(item.id); document.getElementById('installBtn').onclick = () => { showToast("Membuka tautan..."); setTimeout(()=>window.open(item.link,'_blank'),500); }; document.getElementById('detailPanel').classList.add('active'); document.getElementById('mainDock').style.transform = 'translateY(150%)'; loadComments(item.id); };

        window.closeDetail = () => { document.getElementById('detailPanel').classList.remove('active'); document.getElementById('mainDock').style.transform = 'translateY(0)'; };
        window.copyShareLink = () => { if(currentItem){ navigator.clipboard.writeText(currentItem.link); showToast("Link disalin!"); } };
        
        async function handleLike(id) { if(likedItems.includes(id)){ showToast("Sudah disukai"); return; } await runTransaction(ref(db, `apps/${id}/likes`), (c)=>(c||0)+1); likedItems.push(id); if(!favorites.includes(id)) favorites.push(id); localStorage.setItem('themeX_liked',JSON.stringify(likedItems)); localStorage.setItem('themeX_favs',JSON.stringify(favorites)); if(currentItem?.id===id) document.getElementById('detLikeCount').innerText = (currentItem.likes+1); showToast("Berhasil disukai!"); refreshView(); }
        
        window.toggleTheme = () => { const isDark = document.body.getAttribute('data-theme') === 'dark'; document.body.setAttribute('data-theme', isDark ? 'light' : 'dark'); lucide.createIcons(); };
        window.showToast = (msg) => { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('active'); setTimeout(()=>t.classList.remove('active'),2000); };
        window.doSearch = () => { const term = document.getElementById('searchInput').value.toLowerCase(); renderItems(allData.filter(i=>i.name.toLowerCase().includes(term)), 'mainGrid'); };
        
        lucide.createIcons();
    </script>
</body>
</html>
