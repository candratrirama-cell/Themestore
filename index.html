<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ThemeX - Premium Themes Store</title>
    <link rel="icon" href="https://i.ibb.co/nhzx0CS/20260105-114157.png" type="image/png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --card: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --text: #ffffff;
            --text-dim: #a1a1a6;
            --sponsor-bg: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,165,0,0.05));
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --card: rgba(0, 0, 0, 0.05);
            --accent: #000000;
            --text: #000000;
            --text-dim: #636366;
            --sponsor-bg: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,165,0,0.1));
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; 
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            transition: background 0.3s ease; 
            min-height: 100vh; 
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Views */
        .view { 
            display: none; 
            padding-bottom: 100px; 
        }
        .view.active { 
            display: block; 
            animation: fadeIn 0.4s ease; 
        }

        /* Container */
        .container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            padding: 0 16px; 
        }

        /* Header */
        header { 
            padding: 15px 0 10px; 
        }
        .brand-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .brand-row h1 { 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: -1px; 
        }
        .brand-row h1 span { 
            background: linear-gradient(135deg, #FFD700, #FFA500); 
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent; 
        }

        /* Search Bar */
        .search-bar { 
            background: var(--card); 
            border-radius: 18px; 
            display: flex; 
            align-items: center; 
            padding: 0 14px; 
            backdrop-filter: blur(30px); 
        }
        .search-bar input { 
            flex: 1; 
            border: none; 
            background: transparent; 
            padding: 14px 10px; 
            color: var(--text); 
            font-size: 16px; 
            outline: none; 
        }

        /* Grid & Cards */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
            margin-top: 15px; 
        }
        .card { 
            cursor: pointer; 
            transition: transform 0.2s ease; 
        }
        .card:active { 
            transform: scale(0.97); 
        }
        .card-img { 
            width: 100%; 
            aspect-ratio: 0.68; 
            border-radius: 20px; 
            overflow: hidden; 
            background: #111; 
            margin-bottom: 8px; 
        }
        .card-img img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .card-title {
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-dev {
            font-size: 11px;
            color: var(--text-dim);
        }

        /* Sponsor Banner */
        .sponsor-banner-section {
            margin: 20px 0 10px;
            background: var(--sponsor-bg);
            border-radius: 24px;
            padding: 16px;
            border: 2px solid rgba(255,215,0,0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .sponsor-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-weight: 800;
            font-size: 14px;
            color: #ffd700;
        }
        .sponsor-banner-img {
            width: 100%;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .sponsor-banner-img:active { 
            transform: scale(0.98); 
        }
        .countdown-tag {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
            display: inline-block;
            color: #ffd700;
        }

        /* Bottom Dock Navigation */
        .dock-wrap { 
            position: fixed; 
            bottom: 20px; 
            left: 0; 
            right: 0; 
            display: flex; 
            justify-content: center; 
            z-index: 8000; 
            pointer-events: none; 
        }
        .dock { 
            background: rgba(20,20,20,0.8); 
            backdrop-filter: blur(30px); 
            padding: 8px; 
            border-radius: 40px; 
            display: flex; 
            gap: 8px; 
            pointer-events: auto; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .dock-item { 
            width: 50px; 
            height: 50px; 
            border-radius: 30px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-dim); 
            transition: all 0.3s ease; 
            cursor: pointer; 
        }
        .dock-item.active { 
            background: var(--accent); 
            color: var(--bg); 
            width: 110px; 
        }
        .dock-item span { 
            font-size: 14px; 
            font-weight: 700; 
            margin-left: 8px; 
            display: none; 
        }
        .dock-item.active span { 
            display: block; 
        }

        /* Detail Panel */
        .panel { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            z-index: 9000; 
            transform: translateY(100%); 
            transition: transform 0.4s ease; 
            overflow-y: auto; 
        }
        .panel.active { 
            transform: translateY(0); 
        }
        .panel-nav { 
            position: sticky; 
            top: 0; 
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            background: linear-gradient(to bottom, var(--bg) 80%, transparent); 
            z-index: 10; 
        }
        .gallery { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 10px 20px; 
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .gallery-item { 
            min-width: 85%; 
            height: 420px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            scroll-snap-align: center; 
        }
        .gallery-item img { 
            height: 100%; 
            width: auto; 
            max-width: 100%;
            object-fit: contain; 
            border-radius: 12px; 
        }

        /* Comments Section */
        .comments-section { 
            margin-top: 25px; 
            padding: 20px 0; 
            border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .comment-input-area { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
        }
        .comment-input-area input { 
            flex: 1; 
            background: var(--card); 
            border: none; 
            padding: 12px 16px; 
            border-radius: 30px; 
            color: var(--text); 
            outline: none; 
        }
        .comment-input-area button { 
            background: var(--accent); 
            color: var(--bg); 
            border: none; 
            padding: 0 20px; 
            border-radius: 30px; 
            font-weight: 700; 
            cursor: pointer; 
        }
        .comment-item { 
            background: var(--card); 
            border-radius: 16px; 
            padding: 12px; 
            margin-bottom: 12px; 
        }
        .comment-name { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 6px; 
            flex-wrap: wrap; 
        }
        .comment-time { 
            font-size: 10px; 
            opacity: 0.5; 
        }

        /* Buttons */
        .btn-round { 
            width: 44px; 
            height: 44px; 
            border-radius: 22px; 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); 
            color: var(--text); 
            border: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
        }
        .apply-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            padding: 12px 20px; 
            background: rgba(10,10,10,0.95); 
            backdrop-filter: blur(30px); 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            z-index: 10000; 
            transform: translateY(100%); 
            transition: transform 0.4s ease; 
        }
        .panel.active ~ .apply-bar { 
            transform: translateY(0); 
        }
        .btn-apply { 
            width: 100%; 
            height: 50px; 
            border-radius: 25px; 
            background: var(--accent); 
            color: var(--bg); 
            border: none; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            cursor: pointer; 
        }
        .stat-pill { 
            background: var(--card); 
            padding: 6px 12px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 12px; 
        }

        /* Toast Notification */
        #toast { 
            position: fixed; 
            top: 50px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--accent); 
            color: var(--bg); 
            padding: 10px 20px; 
            border-radius: 30px; 
            z-index: 21000; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            pointer-events: none;
            font-weight: 600;
        }
        #toast.active { 
            opacity: 1; 
            top: 60px; 
        }

        /* Interstitial Ad */
        .interstitial-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.95); 
            z-index: 99999; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            backdrop-filter: blur(15px); 
        }
        .interstitial-box { 
            background: var(--bg); 
            border-radius: 48px; 
            max-width: 340px; 
            width: 85%; 
            padding: 24px; 
            text-align: center; 
            border: 3px solid #FFD700; 
            animation: popIn 0.3s ease; 
        }
        .interstitial-countdown { 
            font-size: 48px; 
            font-weight: 800; 
            color: #FFD700; 
            margin: 15px 0; 
        }
        .interstitial-btn { 
            background: #FFD700; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 40px; 
            font-weight: bold; 
            cursor: pointer; 
            opacity: 0.5; 
        }
        .interstitial-btn.active { 
            opacity: 1; 
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body data-theme="dark">
    <div id="toast">Notifikasi</div>
    
    <!-- Home View -->
    <div id="view-home" class="view active">
        <div class="container">
            <header>
                <div class="brand-row">
                    <h1>theme<span>X</span></h1>
                    <button class="btn-round" onclick="toggleTheme()" id="themeToggle">
                        <i data-lucide="moon"></i>

                </div>
                <div class="search-bar">

            <div class="stat-pill" style="justify-content:space-between;padding:22px;margin-bottom:12px;cursor:pointer" onclick="window.open('https://whatsapp.com/channel/0029VbB8MZt8V0ttSDmHn22j','_blank')">
                <div><i data-lucide="message-circle"></i> Saluran WhatsApp</div>

            </div>
            <div class="stat-pill" style="justify-content:space-between;padding:22px;cursor:pointer" onclick="window.open('https://saweria.co/ramateam','_blank')">

    <!-- Bottom Navigation -->
    <div class="dock-wrap" id="mainDock">
        <div class="dock">

    <!-- Detail Panel -->
    <div id="detailPanel" class="panel">
        <div class="panel-nav">
            <button class="btn-round" onclick="closeDetail()">

    </div>

    <!-- Download Bar -->
    <div class="apply-bar" id="bottomApplyBar">
        <button class="btn-apply" id="installBtn">
            <i data-lucide="download-cloud"></i> UNDUH TEMA
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = { 
            databaseURL: "https://miningtransaction-default-rtdb.asia-southeast1.firebasedatabase.app" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Global Variables
        let allData = [];
        let favorites = JSON.parse(localStorage.getItem('themeX_favs') || '[]');
        let likedItems = JSON.parse(localStorage.getItem('themeX_liked') || '[]');
        let currentItem = null;
        let sponsorData = null;
        let interstitialShownThisSession = false;
        let countdownInterval = null;

        // Load Themes from Firebase
        onValue(ref(db, 'apps/'), (snap) => {
            const data = snap.val();
            if (data) {
                allData = Object.keys(data)
                    .filter(key => !data[key].is_apk)
                    .map(key => ({ 
                        id: key, 
                        ...data[key], 
                        likes: data[key].likes || 0 
                    }));
                refreshView();
            }
        });

        // Load Sponsor Data
        onValue(ref(db, 'sponsor/'), (snap) => {
            sponsorData = snap.val();
            renderBannerSponsor();
            
            if (sponsorData && sponsorData.active && Date.now() < sponsorData.expiryTime && sponsorData.imageUrl) {
                const popupKey = `popupShown_${sponsorData.updatedAt}`;
                const interstitialKey = `interstitialShown_${sponsorData.updatedAt}`;
                
                if (sponsorData.adType === 'popup' && !localStorage.getItem(popupKey)) {
                    showPopupSponsor();
                }
                if (sponsorData.adType === 'interstitial' && !interstitialShownThisSession && !localStorage.getItem(interstitialKey)) {
                    showInterstitialSponsor();
                }
            }
        });

        // Render Banner Sponsor
        function renderBannerSponsor() {
            const containers = ['bannerSponsorContainer', 'bannerSponsorBrowse'];
            const isValid = sponsorData && 
                           sponsorData.active && 
                           Date.now() < sponsorData.expiryTime && 
                           sponsorData.imageUrl && 
                           sponsorData.adType === 'banner';
            
            if (!isValid) {
                containers.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.innerHTML = '';
                });
                return;
            }
            
            const html = `
                <div class="sponsor-banner-section">
                    <div class="sponsor-header">
                        <i data-lucide="crown"></i> 
                        <span>✨ DISPONSORI OLEH ✨</span>
                    </div>
                    <img src="${sponsorData.imageUrl}" 
                         class="sponsor-banner-img" 
                         onclick="window.open('${sponsorData.link}','_blank')" 
                         onerror="this.src='https://placehold.co/800x200?text=Sponsor'">
                    <div class="countdown-tag" id="bannerCountdown"></div>
                </div>
            `;
            
            containers.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = html;
            });
            
            lucide.createIcons();
            startBannerCountdown(sponsorData.expiryTime);
        }

        // Start Banner Countdown Timer
        function startBannerCountdown(expiry) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            const update = () => {
                const diff = expiry - Date.now();
                if (diff <= 0) {
                    if (countdownInterval) clearInterval(countdownInterval);
                    return;
                }
                const days = Math.floor(diff / 86400000);
                const hours = Math.floor((diff % 86400000) / 3600000);
                const mins = Math.floor((diff % 3600000) / 60000);
                
                let text = days > 0 ? `${days} hari lagi` : 
                          hours > 0 ? `${hours} jam ${mins} menit` : 
                          `${mins} menit`;
                
                const el = document.getElementById('bannerCountdown');
                if (el) el.innerText = `🎉 Promo spesial berakhir: ${text}`;
            };
            
            update();
            countdownInterval = setInterval(update, 60000);
        }

        // Show Popup Sponsor
        function showPopupSponsor() {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(15px);z-index:100001;display:flex;justify-content:center;align-items:center;';
            modal.innerHTML = `
                <div style="background:var(--bg);border-radius:48px;max-width:320px;width:85%;padding:24px;text-align:center;border:2px solid #FFD700;animation:popIn 0.3s ease">
                    <i data-lucide="gift" style="width:50px;height:50px;color:#FFD700"></i>
                    <h2 style="margin:12px 0">✨ Sponsor Spesial</h2>
                    <img src="${sponsorData.imageUrl}" style="width:100%;border-radius:24px;margin:12px 0" onerror="this.src='https://placehold.co/400x200?text=Sponsor'">
                    <button id="popupCloseBtn" style="background:#FFD700;border:none;padding:12px 24px;border-radius:40px;font-weight:bold;margin-top:8px;cursor:pointer">Lihat Promo</button>
                    <p style="margin-top:12px;font-size:12px;opacity:0.6">Klik di luar untuk tutup</p>
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons();
            
            const closeBtn = modal.querySelector('#popupCloseBtn');
            closeBtn.onclick = () => {
                window.open(sponsorData.link, '_blank');
                modal.remove();
            };
            modal.onclick = (e) => {
                if (e.target === modal) modal.remove();
            };
            
            localStorage.setItem(`popupShown_${sponsorData.updatedAt}`, 'true');
            setTimeout(() => modal.remove(), 15000);
        }

        // Show Interstitial Sponsor
        function showInterstitialSponsor() {
            interstitialShownThisSession = true;
            localStorage.setItem(`interstitialShown_${sponsorData.updatedAt}`, 'true');
            
            const overlay = document.createElement('div');
            overlay.className = 'interstitial-overlay';
            let countdown = 5;
            
            overlay.innerHTML = `
                <div class="interstitial-box">
                    <i data-lucide="alert-triangle" style="width:50px;height:50px;color:#FFD700"></i>
                    <h2 style="margin:12px 0">✨ Iklan Sponsor ✨</h2>
                    <img src="${sponsorData.imageUrl}" style="width:100%;border-radius:24px;margin:12px 0" onerror="this.src='https://placehold.co/400x200?text=Sponsor'">
                    <div class="interstitial-countdown" id="interstitialCountdown">5</div>
                    <button id="interstitialBtn" class="interstitial-btn" disabled>⏳ Tunggu 5 detik</button>
                </div>
            `;
            document.body.appendChild(overlay);
            lucide.createIcons();
            
            const btn = overlay.querySelector('#interstitialBtn');
            const cdSpan = overlay.querySelector('#interstitialCountdown');
            
            const timer = setInterval(() => {
                countdown--;
                if (cdSpan) cdSpan.innerText = countdown;
                if (btn) btn.innerText = countdown > 0 ? `⏳ Tunggu ${countdown} detik` : '✅ Buka Promo Sekarang';
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    if (btn) {
                        btn.disabled = false;
                        btn.classList.add('active');
                        btn.innerText = '✅ Buka Promo Sekarang';
                        btn.onclick = () => {
                            window.open(sponsorData.link, '_blank');
                            overlay.remove();
                        };
                    }
                }
            }, 1000);
            
            overlay.onclick = (e) => {
                if (e.target === overlay && countdown <= 0) overlay.remove();
            };
        }

        // Render Items Grid
        function renderItems(items, gridId) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            
            if (!items.length) {
                grid.innerHTML = '<div class="empty-state">✨ Belum ada tema tersedia</div>';
                return;
            }
            
            grid.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openDetail(item);
                div.innerHTML = `
                    <div class="card-img">
                        <img src="${item.images?.[0] || ''}" loading="lazy" onerror="this.src='https://placehold.co/400x600?text=No+Image'">
                    </div>
                    <div>
                        <div class="card-title">${escapeHtml(item.name)}</div>
                        <div class="card-dev">${escapeHtml(item.dev || 'Verified')}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        // Refresh Current View
        function refreshView() {
            const activeView = document.querySelector('.view.active')?.id;
            
            if (activeView === 'view-home') {
                renderItems(allData, 'mainGrid');
            } else if (activeView === 'view-browse') {
                renderItems([...allData].reverse(), 'browseGrid');
            } else if (activeView === 'view-fav') {
                renderItems(allData.filter(i => favorites.includes(i.id)), 'favGrid');
            }
        }

        // Switch View
        window.switchView = (viewName, element) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            element.classList.add('active');
            
            refreshView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Open Detail Panel
        window.openDetail = (item) => {
            currentItem = item;
            
            document.getElementById('detTitle').innerText = item.name;
            document.getElementById('detAuthor').querySelector('span').innerText = item.dev || 'ThemeX';
            document.getElementById('detLikeCount').innerText = item.likes;
            document.getElementById('detSize').innerText = item.size || '3.5 MB';
            document.getElementById('detDesc').innerText = item.desc || "Tema premium eksklusif untuk tampilan HP yang lebih keren.";
            
            const gallery = document.getElementById('detGallery');
            gallery.innerHTML = '';
            
            if (item.images && item.images.length) {
                item.images.forEach(img => {
                    gallery.innerHTML += `<div class="gallery-item"><img src="${img}" loading="lazy" onerror="this.src='https://placehold.co/400x600?text=No+Image'"></div>`;
                });
            } else {
                gallery.innerHTML = '<div class="gallery-item"><div style="text-align:center">Tidak ada gambar</div></div>';
            }
            
            const likeBtn = document.getElementById('detLikeBtn');
            likeBtn.style.color = likedItems.includes(item.id) ? '#ff3b30' : 'var(--text)';
            likeBtn.onclick = () => handleLike(item.id);
            
            const installBtn = document.getElementById('installBtn');
            installBtn.onclick = () => {
                if (item.link) {
                    showToast("Membuka link...");
                    setTimeout(() => window.open(item.link, '_blank'), 300);
                } else {
                    showToast("Link tidak tersedia");
                }
            };
            
            loadComments(item.id);
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('mainDock').style.transform = 'translateY(150%)';
        };

        // Close Detail Panel
        window.closeDetail = () => {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('mainDock').style.transform = 'translateY(0)';
            currentItem = null;
        };

        // Handle Like
        async function handleLike(id) {
            if (likedItems.includes(id)) {
                showToast("Sudah disukai!");
                return;
            }
            
            try {
                await runTransaction(ref(db, `apps/${id}/likes`), (current) => (current || 0) + 1);
                likedItems.push(id);
                if (!favorites.includes(id)) favorites.push(id);
                
                localStorage.setItem('themeX_liked', JSON.stringify(likedItems));
                localStorage.setItem('themeX_favs', JSON.stringify(favorites));
                
                const likeCount = parseInt(document.getElementById('detLikeCount').innerText) + 1;
                document.getElementById('detLikeCount').innerText = likeCount;
                document.getElementById('detLikeBtn').style.color = '#ff3b30';
                
                showToast("✅ Disukai & ditambahkan ke favorit!");
                refreshView();
            } catch (error) {
                console.error("Error liking:", error);
                showToast("Gagal menyukai, coba lagi");
            }
        }

        // Load Comments
        function loadComments(themeId) {
            const commentsRef = ref(db, `comments/${themeId}`);
            onValue(commentsRef, (snap) => {
                const comments = snap.val();
                const container = document.getElementById('commentsList');
                
                if (!comments) {
                    container.innerHTML = '<div class="empty-state">💬 Belum ada komentar. Jadi yang pertama!</div>';
                    return;
                }
                
                const commentsArray = Object.entries(comments).map(([id, val]) => ({ id, ...val }));
                commentsArray.sort((a, b) => b.timestamp - a.timestamp);
                
                container.innerHTML = commentsArray.map(c => `
                    <div class="comment-item">
                        <div class="comment-name">
                            <i data-lucide="user"></i> 
                            <strong>${escapeHtml(c.name)}</strong>
                            <span class="comment-time">${new Date(c.timestamp).toLocaleString()}</span>
                        </div>
                        <div>${escapeHtml(c.text)}</div>
                    </div>
                `).join('');
                lucide.createIcons();
            });
        }

        // Post Comment
        window.postComment = async () => {
            if (!currentItem) {
                showToast("Tidak ada tema yang dipilih");
                return;
            }
            
            let name = document.getElementById('commentNameInput').value.trim();
            const text = document.getElementById('commentTextInput').value.trim();
            
            if (!name) name = "Anonim";
            if (!text) {
                showToast("Komentar tidak boleh kosong!");
                return;
            }
            
            try {
                await push(ref(db, `comments/${currentItem.id}`), {
                    name: name.slice(0, 30),
                    text: text.slice(0, 200),
                    timestamp: Date.now()
                });
                document.getElementById('commentTextInput').value = '';
                showToast("💬 Komentar terkirim!");
            } catch (error) {
                console.error("Error posting comment:", error);
                showToast("Gagal mengirim komentar");
            }
        };

        // Copy Share Link
        window.copyShareLink = () => {
            if (currentItem && currentItem.link) {
                navigator.clipboard.writeText(currentItem.link);
                showToast("🔗 Link tema disalin!");
            } else {
                showToast("Link tidak tersedia");
            }
        };

        // Toggle Theme
        window.toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            lucide.createIcons();
            
            const themeIcon = document.querySelector('#themeToggle i');
            if (themeIcon) {
                themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            }
        };

        // Show Toast
        window.showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 2000);
        };

        // Search Function
        window.doSearch = () => {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(item => 
                item.name.toLowerCase().includes(searchTerm)
            );
            renderItems(filtered, 'mainGrid');
        };

        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, (m) => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Initialize Dock Navigation
        function initDockNavigation() {
            const dockItems = document.querySelectorAll('.dock-item');
            dockItems.forEach(item => {
                item.addEventListener('click', () => {
                    const viewName = item.getAttribute('data-view');
                    if (viewName) switchView(viewName, item);
                });
            });
        }

        // Initialize
        initDockNavigation();
        lucide.createIcons();
    </script>
</body>
</html>
