<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ThemeX - Premium Themes Store</title>
    <link rel="icon" href="https://i.ibb.co/nhzx0CS/20260105-114157.png" type="image/png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --card: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --text: #ffffff;
            --text-dim: #a1a1a6;
            --glass-border: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.2) 100%);
            --ios-blur: blur(30px) saturate(210%);
            --ios-bezier: cubic-bezier(0.25, 1, 0.5, 1);
            --heart: #ff3b30;
            --sponsor-bg: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,165,0,0.05));
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --card: rgba(0, 0, 0, 0.05);
            --accent: #000000;
            --text: #000000;
            --text-dim: #636366;
            --glass-border: linear-gradient(135deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.1) 100%);
            --sponsor-bg: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,165,0,0.1));
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); transition: background 0.5s var(--ios-bezier); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .view { display: none; padding-bottom: 120px; }
        .view.active { display: block; animation: viewEnter 0.5s var(--ios-bezier); }
        @keyframes viewEnter { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 16px; }
        header { padding: 15px 0 10px; }
        .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-row h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .brand-row h1 span { background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .search-bar { background: var(--card); border-radius: 18px; position: relative; display: flex; align-items: center; padding: 0 14px; backdrop-filter: var(--ios-blur); }
        .search-bar input { flex: 1; border: none; background: transparent; padding: 14px 10px; color: var(--text); font-size: 16px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 15px; }
        .card { cursor: pointer; transition: 0.3s var(--ios-bezier); width: 100%; }
        .card:active { transform: scale(0.97); }
        .card-img { width: 100%; aspect-ratio: 0.68; border-radius: 20px; overflow: hidden; background: #111; position: relative; margin-bottom: 8px; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Sponsor Banner */
        .sponsor-section { margin: 20px 0 10px; background: var(--sponsor-bg); border-radius: 24px; padding: 16px; border: 1px solid rgba(255,215,0,0.3); backdrop-filter: blur(10px); }
        .sponsor-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: 700; font-size: 14px; color: #ffd700; }
        .sponsor-banner { width: 100%; border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform 0.3s; }
        .sponsor-banner img { width: 100%; height: auto; display: block; }
        .sponsor-banner:active { transform: scale(0.98); }
        .countdown-tag { display: inline-block; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 8px; color: #ffd700; }
        
        .dock-wrap { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 8000; pointer-events: none; transition: transform 0.4s var(--ios-bezier); }
        .dock { background: rgba(20, 20, 20, 0.7); backdrop-filter: var(--ios-blur); padding: 6px; border-radius: 32px; display: flex; gap: 8px; position: relative; pointer-events: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .dock-item { width: 50px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: 0.4s var(--ios-bezier); cursor: pointer; }
        .dock-item.active { background: var(--accent); color: var(--bg); width: 120px; }
        .dock-item span { font-size: 14px; font-weight: 700; margin-left: 8px; display: none; }
        .dock-item.active span { display: block; }
        
        .panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9000; transform: translateY(100%); transition: 0.5s var(--ios-bezier); overflow-y: auto; padding-bottom: 180px; }
        .panel.active { transform: translateY(0); }
        .panel-nav { position: sticky; top: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, var(--bg) 80%, transparent); z-index: 9999; }
        .gallery { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 10px 20px; margin-bottom: 10px; scroll-snap-type: x mandatory; }
        .gallery-item { min-width: 85%; height: 420px; display: flex; justify-content: center; align-items: center; scroll-snap-align: center; border-radius: 24px; overflow: hidden; }
        .gallery-item img { height: 100%; width: auto; max-width: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .comments-section { margin-top: 25px; padding: 20px 0 30px; border-top: 1px solid rgba(255,255,255,0.1); }
        .comment-input-area { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .comment-input-area input { flex: 1; background: var(--card); border: none; padding: 12px 16px; border-radius: 30px; color: var(--text); font-size: 14px; outline: none; min-width: 120px; }
        .comment-input-area button { background: var(--accent); color: var(--bg); border: none; padding: 0 20px; border-radius: 30px; font-weight: 700; cursor: pointer; }
        .comment-item { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
        .comment-name { font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .comment-time { font-size: 10px; opacity: 0.5; }
        .comment-text { font-size: 14px; line-height: 1.4; }
        
        .btn-round { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: var(--text); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .apply-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 10px)); background: rgba(10, 10, 10, 0.9); backdrop-filter: var(--ios-blur); display: flex; flex-direction: column; gap: 8px; z-index: 10000; transform: translateY(100%); transition: 0.5s var(--ios-bezier); border-top: 1px solid rgba(255,255,255,0.1); }
        .panel.active ~ .apply-bar { transform: translateY(0); }
        .btn-tutorial { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 12px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-apply { width: 100%; height: 50px; border-radius: 25px; background: var(--accent); color: var(--bg); border: none; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .btn-apply:active { transform: scale(0.96); }
        .stat-pill { background: var(--card); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; position: relative; }
        #toast { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--bg); padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 800; z-index: 21000; opacity: 0; transition: 0.4s; pointer-events: none; }
        #toast.active { opacity: 1; top: 60px; }
    </style>
</head>
<body data-theme="dark">
    <div id="toast">Notifikasi</div>
    <div id="view-home" class="view active">
        <div class="container">
            <header>
                <div class="brand-row"><h1>theme<span>X</span></h1><button class="btn-round" onclick="toggleTheme()"><i data-lucide="moon"></i></button></div>
                <div class="search-bar"><i data-lucide="search" style="color: var(--text-dim)"></i><input type="text" id="searchInput" placeholder="Cari tema premium..." oninput="doSearch()"></div>
            </header>
            <div id="sponsorBannerHome" class="sponsor-section" style="display: none;"></div>
            <div class="grid" id="mainGrid"></div>
        </div>
    </div>
    <div id="view-browse" class="view">
        <div class="container"><header><h1>Jelajahi</h1></header><div id="sponsorBannerBrowse" class="sponsor-section" style="display: none;"></div><div class="grid" id="browseGrid"></div></div>
    </div>
    <div id="view-fav" class="view">
        <div class="container"><header><h1>Favorit</h1></header><div id="favGrid" class="grid"></div></div>
    </div>
    <div id="view-settings" class="view">
        <div class="container"><header><h1>Menu</h1></header>
            <div class="stat-pill" style="justify-content: space-between; padding: 22px; margin-bottom: 12px; cursor:pointer; border-radius: 20px;" onclick="window.open('https://whatsapp.com/channel/0029VbB8MZt8V0ttSDmHn22j', '_blank')">
                <div style="display: flex; align-items: center; gap: 12px;"><i data-lucide="message-circle" style="color:#25D366"></i> Saluran WhatsApp</div><i data-lucide="chevron-right"></i>
            </div>
            <div class="stat-pill" style="justify-content: space-between; padding: 22px; margin-bottom: 12px; cursor:pointer; border-radius: 20px;" onclick="window.open('https://saweria.co/ramateam', '_blank')">
                <div style="display: flex; align-items: center; gap: 12px;"><i data-lucide="heart" style="color:#ff3b30"></i> Donasi Developer</div><i data-lucide="external-link"></i>
            </div>
        </div>
    </div>
    <div class="dock-wrap" id="mainDock"><div class="dock"><div class="dock-item active" onclick="switchView('home', this)"><i data-lucide="home"></i><span>Beranda</span></div><div class="dock-item" onclick="switchView('browse', this)"><i data-lucide="compass"></i><span>Jelajah</span></div><div class="dock-item" onclick="switchView('fav', this)"><i data-lucide="heart"></i><span>Favorit</span></div><div class="dock-item" onclick="switchView('settings', this)"><i data-lucide="menu"></i><span>Menu</span></div></div></div>
    <div id="detailPanel" class="panel"><div class="panel-nav"><button class="btn-round" onclick="closeDetail()"><i data-lucide="chevron-down"></i></button><button class="btn-round" onclick="copyShareLink()"><i data-lucide="share-2"></i></button></div><div class="gallery" id="detGallery"></div><div class="container"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;"><div style="flex:1"><h2 id="detTitle" style="font-size:24px;font-weight:800">Nama Tema</h2><p id="detAuthor" style="color:var(--text-dim);font-size:13px"><i data-lucide="shield-check" style="width:14px;color:#34c759"></i> <span>ThemeX Creator</span></p></div><button id="detLikeBtn" class="btn-round" style="width:50px;height:50px;border-radius:25px"><i data-lucide="heart"></i></button></div><div style="display:flex;gap:8px;margin-bottom:20px"><div class="stat-pill"><i data-lucide="thumbs-up" style="width:12px"></i> <span id="detLikeCount">0</span></div><div class="stat-pill"><i data-lucide="box" style="width:12px"></i> <span id="detSize">3.5 MB</span></div></div><p id="detDesc" style="line-height:1.5;color:var(--text-dim);font-size:14px;margin-bottom:30px"></p><div class="comments-section"><h3 style="margin-bottom:12px">💬 Komentar</h3><div class="comment-input-area"><input type="text" id="commentNameInput" placeholder="Nama kamu..." maxlength="30"><input type="text" id="commentTextInput" placeholder="Tulis komentar..."><button onclick="postComment()">Kirim</button></div><div id="commentsList"></div></div></div></div>
    <div class="apply-bar" id="bottomApplyBar"><button class="btn-tutorial" onclick="window.open('https://vt.tiktok.com/ZSmoDshWL/', '_blank')"><i data-lucide="play" style="margin-right:6px;width:14px"></i> Tutorial Pemasangan</button><button class="btn-apply" id="installBtn"><i data-lucide="download-cloud"></i> UNDUH TEMA</button></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://miningtransaction-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let allData = [];
        let favorites = JSON.parse(localStorage.getItem('themeX_favs') || '[]');
        let likedItems = JSON.parse(localStorage.getItem('themeX_liked') || '[]');
        let currentItem = null;
        let sponsorData = null;
        let countdownInterval = null;

        onValue(ref(db, 'apps/'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                allData = Object.keys(data).filter(key => !data[key].is_apk).map(key => ({ id: key, ...data[key], likes: data[key].likes || 0 }));
                refreshView();
            }
        });

        onValue(ref(db, 'sponsor/'), (snap) => {
            sponsorData = snap.val();
            renderSponsorBanners();
        });

        function renderSponsorBanners() {
            const containers = ['sponsorBannerHome', 'sponsorBannerBrowse'];
            if (!sponsorData || !sponsorData.imageUrl || !sponsorData.active || Date.now() > sponsorData.expiryTime) {
                containers.forEach(id => { const el = document.getElementById(id); if(el) el.style.display = 'none'; });
                if(countdownInterval) clearInterval(countdownInterval);
                return;
            }
            const html = `<div class="sponsor-header"><i data-lucide="crown"></i> <span>DISPONSORI OLEH</span></div><div class="sponsor-banner" onclick="window.open('${sponsorData.link}', '_blank')"><img src="${sponsorData.imageUrl}" alt="sponsor"></div><div class="countdown-tag" id="sponsorCountdown"></div>`;
            containers.forEach(id => { const el = document.getElementById(id); if(el) { el.style.display = 'block'; el.innerHTML = html; } });
            lucide.createIcons();
            startCountdown(sponsorData.expiryTime);
        }

        function startCountdown(expiry) {
            if(countdownInterval) clearInterval(countdownInterval);
            const update = () => {
                const diff = expiry - Date.now();
                if(diff <= 0) { document.querySelectorAll('.countdown-tag').forEach(el => { if(el) el.innerText = '✨ Promo Berakhir ✨'; }); return; }
                const days = Math.floor(diff / 86400000);
                const hours = Math.floor((diff % 86400000) / 3600000);
                const mins = Math.floor((diff % 3600000) / 60000);
                const secs = Math.floor((diff % 60000) / 1000);
                let text = days > 0 ? `${days} hari lagi` : `${hours} jam ${mins} menit`;
                document.querySelectorAll('.countdown-tag').forEach(el => { if(el) el.innerText = `🎉 Promo berakhir: ${text}`; });
            };
            update();
            countdownInterval = setInterval(update, 1000);
        }

        function refreshView() {
            const activeView = document.querySelector('.view.active').id;
            if(activeView === 'view-home') renderItems(allData, 'mainGrid');
            if(activeView === 'view-browse') renderItems([...allData].reverse(), 'browseGrid');
            if(activeView === 'view-fav') renderItems(allData.filter(i => favorites.includes(i.id)), 'favGrid');
        }

        function renderItems(items, gridId) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = items.length ? '' : '<p style="grid-column:1/-1;text-align:center;padding:60px;opacity:0.3">Belum ada tema.</p>';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openDetail(item);
                div.innerHTML = `<div class="card-img"><img src="${item.images?.[0] || ''}" loading="lazy"></div><div style="padding:0 4px"><p style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</p><p style="font-size:11px;color:var(--text-dim)">${item.dev || 'Verified'}</p></div>`;
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        window.switchView = (viewName, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            el.classList.add('active');
            refreshView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function loadComments(themeId) {
            const commentsRef = ref(db, `comments/${themeId}`);
            onValue(commentsRef, (snap) => {
                const comments = snap.val();
                const container = document.getElementById('commentsList');
                if(!container) return;
                if(!comments) { container.innerHTML = '<div style="opacity:0.5;text-align:center;padding:20px">Belum ada komentar.</div>'; return; }
                const arr = Object.entries(comments).map(([id, val]) => ({ id, ...val })).sort((a,b) => b.timestamp - a.timestamp);
                container.innerHTML = arr.map(c => `<div class="comment-item"><div class="comment-name"><i data-lucide="user" style="width:14px"></i> ${escapeHtml(c.name)} <span class="comment-time">${new Date(c.timestamp).toLocaleString()}</span></div><div class="comment-text">${escapeHtml(c.text)}</div></div>`).join('');
                lucide.createIcons();
            });
        }

        window.postComment = async () => {
            if(!currentItem) return;
            let name = document.getElementById('commentNameInput').value.trim();
            const text = document.getElementById('commentTextInput').value.trim();
            if(!name) name = "Anonim";
            if(!text) { showToast("Komentar tidak boleh kosong"); return; }
            await push(ref(db, `comments/${currentItem.id}`), { name: name.slice(0,30), text: text.slice(0,200), timestamp: Date.now() });
            document.getElementById('commentTextInput').value = '';
            showToast("Komentar terkirim!");
        };

        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

        window.openDetail = (item) => {
            currentItem = item;
            document.getElementById('detTitle').innerText = item.name;
            document.getElementById('detAuthor').querySelector('span').innerText = item.dev || 'ThemeX Creator';
            document.getElementById('detLikeCount').innerText = item.likes;
            document.getElementById('detSize').innerText = item.size || '3.5 MB';
            document.getElementById('detDesc').innerText = item.desc || "Tampilan premium untuk hp Anda.";
            const gallery = document.getElementById('detGallery');
            gallery.innerHTML = '';
            (item.images || []).forEach(img => { gallery.innerHTML += `<div class="gallery-item"><img src="${img}"></div>`; });
            document.getElementById('detLikeBtn').style.color = likedItems.includes(item.id) ? 'var(--heart)' : 'var(--text)';
            document.getElementById('detLikeBtn').onclick = () => handleLike(item.id);
            document.getElementById('installBtn').onclick = () => { showToast("Membuka tautan..."); setTimeout(() => window.open(item.link, '_blank'), 500); };
            loadComments(item.id);
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('mainDock').style.transform = 'translateY(150%)';
        };

        window.closeDetail = () => {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('mainDock').style.transform = 'translateY(0)';
            currentItem = null;
        };

        window.copyShareLink = () => { if(currentItem) { navigator.clipboard.writeText(currentItem.link); showToast("Link disalin!"); } };
        async function handleLike(id) {
            if(likedItems.includes(id)) { showToast("Sudah disukai!"); return; }
            await runTransaction(ref(db, `apps/${id}/likes`), (c) => (c || 0) + 1);
            likedItems.push(id);
            if(!favorites.includes(id)) favorites.push(id);
            localStorage.setItem('themeX_liked', JSON.stringify(likedItems));
            localStorage.setItem('themeX_favs', JSON.stringify(favorites));
            document.getElementById('detLikeCount').innerText = parseInt(document.getElementById('detLikeCount').innerText) + 1;
            showToast("Disukai & ditambahkan ke favorit!");
            refreshView();
        }
        window.toggleTheme = () => { const isDark = document.body.getAttribute('data-theme') === 'dark'; document.body.setAttribute('data-theme', isDark ? 'light' : 'dark'); lucide.createIcons(); };
        window.showToast = (msg) => { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('active'); setTimeout(() => t.classList.remove('active'), 2000); };
        window.doSearch = () => { renderItems(allData.filter(i => i.name.toLowerCase().includes(document.getElementById('searchInput').value.toLowerCase())), 'mainGrid'); };
        lucide.createIcons();
        
        // Intro Sponsor Modal Meriah
        setTimeout(async () => {
            if(!localStorage.getItem('sponsorIntroShown') && sponsorData && sponsorData.active && Date.now() < sponsorData.expiryTime) {
                const modal = document.createElement('div');
                modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);z-index:100000;display:flex;justify-content:center;align-items:center;flex-direction:column;';
                modal.innerHTML = `<div style="background:var(--bg);border-radius:48px;max-width:320px;width:80%;padding:24px;text-align:center;border:2px solid gold"><i data-lucide="gift" style="width:60px;height:60px;color:gold"></i><h2 style="margin:16px 0 8px">🎉 Spesial Untukmu!</h2><p style="margin-bottom:20px">Dipersembahkan oleh sponsor eksklusif</p><img src="${sponsorData.imageUrl}" style="width:100%;border-radius:24px;margin-bottom:20px"><button id="closeSponsorModal" style="background:gold;border:none;padding:12px 28px;border-radius:40px;font-weight:bold">Lihat Promo</button></div>`;
                document.body.appendChild(modal);
                lucide.createIcons();
                document.getElementById('closeSponsorModal').onclick = () => { window.open(sponsorData.link, '_blank'); modal.remove(); };
                modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
                localStorage.setItem('sponsorIntroShown', 'true');
            }
        }, 1000);
    </script>
</body>
</html>
